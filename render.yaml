# Render Blueprint — deve ficar na RAIZ do repositório Git
# Deploy: Render Dashboard → New + → Blueprint (NÃO "Web Service")

services:
  - type: web
    name: onecheck-api
    runtime: python
    region: oregon
    plan: free
    rootDir: onecheck-api
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: onecheck-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_SECRET
        generateValue: true

  - type: web
    name: onecheck-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /public/login.php
    envVars:
      - key: ONECHECK_API_URL
        value: https://onecheck-api.onrender.com/api/v1
      - key: ONECHECK_BASE_PATH
        value: ""

databases:
  - name: onecheck-db
    plan: free
    databaseName: onecheck
    user: onecheck
